# ========================================================
# PREMIUM PORTFOLIO - SPRING BOOT CONFIGURATION
# ========================================================
spring.application.name=premium-portfolio

# Optional config imports for local secrets (.env or application-local.properties)
spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml

# Database Configuration (Default: H2 in-memory with file persistence for zero-config reliability)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/portfoliodb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (Disabled in production for security)
spring.h2.console.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Rate Limiting Configuration
portfolio.ratelimit.requests-per-window=5
portfolio.ratelimit.window-minutes=15

# Profile Info (Configurable)
portfolio.owner.name=Sahil Nikam
portfolio.owner.title=Software Developer
portfolio.owner.role=Software Developer Intern @ CodeMetric
portfolio.owner.email=sahilnikam005@gmail.com
portfolio.owner.github=https://github.com/SahilSatishNikam
portfolio.owner.linkedin=https://www.linkedin.com/in/sahil-nikam-2b58b4317

# Email Configuration (JavaMailSender for contact notifications)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

portfolio.mail.to=${PORTFOLIO_MAIL_TO:sahilnikam005@gmail.com}
portfolio.mail.enabled=${PORTFOLIO_MAIL_ENABLED:true}
